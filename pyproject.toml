[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feature-gates"
version = "0.1.0"
description = "Deterministic, dependency-free feature flags for Python services"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yavin Songkham"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
